<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>まちよみ（奈良市）</title>
    <style>
      :root {
        --primary-color: #4a90e2;
        --accent-color: #e74c3c;
        --bg-color: #f0f2f5;
        --checked-bg: #f8f9fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: sans-serif;
        background-color: var(--bg-color);
        padding: 15px;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }

      /* ヘッダー・ハンバーガーメニュー */
      header {
        width: 100%;
        max-width: 600px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 15px 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
        position: relative;
      }
      header h3 {
        margin: 0;
        font-size: 1.2rem;
        color: #333;
      }
      .hamburger-btn {
        background: none;
        border: none;
        font-size: 1.6rem;
        cursor: pointer;
        padding: 5px;
        color: #333;
      }
      .menu-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 5px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        padding: 15px;
        z-index: 100;
        width: 280px;
        text-align: left;
      }
      .menu-dropdown.active {
        display: block;
      }
      .menu-item {
        margin-bottom: 12px;
      }
      .menu-item:last-child {
        margin-bottom: 0;
      }
      .menu-item label.menu-title {
        display: block;
        font-size: 0.85rem;
        color: #666;
        margin-bottom: 5px;
        font-weight: bold;
      }

      /* カスタムファイル選択のスタイル */
      .custom-file-input {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .custom-file-input input[type="file"] {
        display: none;
      }
      .file-choose-btn {
        background-color: #6c757d;
        color: white;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        white-space: nowrap;
        font-weight: bold;
      }
      .file-choose-btn:hover {
        opacity: 0.8;
      }
      .file-name {
        font-size: 0.8rem;
        color: #666;
        word-break: break-all;
      }

      .controls {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
        width: 100%;
        max-width: 600px;
        text-align: center;
      }

      /* 統計表示エリアのスタイル */
      .stats-container {
        display: flex;
        justify-content: space-around;
        margin: 5px 0 15px 0;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 8px;
        font-size: 0.9rem;
        border: 1px solid #eee;
      }
      .stat-item {
        display: flex;
        flex-direction: column;
      }
      .stat-value {
        font-weight: bold;
        font-size: 1.2rem;
        color: var(--primary-color);
      }

      .filter-section {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      #wordList {
        width: 100%;
        max-width: 600px;
      }

      .word-card {
        background: white;
        margin-bottom: 10px;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        transition: all 0.2s;
      }

      .word-card.is-checked {
        background-color: var(--checked-bg);
        opacity: 0.8;
      }

      .check-box {
        width: 24px;
        height: 24px;
        margin-right: 15px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .card-content {
        flex-grow: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .kanji {
        font-weight: bold;
        font-size: 1.1rem;
        color: #333;
        word-break: break-all;
      }
      .kana {
        color: var(--primary-color);
        font-weight: bold;
        background: #eef5ff;
        padding: 4px 10px;
        border-radius: 4px;
        visibility: hidden;
        white-space: nowrap;
      }

      .word-card.is-checked .kana {
        visibility: visible;
      }

      .hidden {
        display: none !important;
      }

      .btn {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.9rem;
      }
      .btn:hover {
        opacity: 0.8;
      }
      .btn-orange {
        background-color: var(--accent-color);
      }
      .btn-clear {
        background-color: #999;
        font-size: 0.8rem;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h3>まちよみ（奈良市）</h3>
      <button id="hamburgerBtn" class="hamburger-btn" aria-label="メニュー">☰</button>
      <div id="menuDropdown" class="menu-dropdown">
        <div class="menu-item">
          <label class="menu-title">外部CSVファイルを読み込む</label>
          <div class="custom-file-input">
            <input type="file" id="csvFile" accept=".csv" />
            <label for="csvFile" class="file-choose-btn">ファイルを選択</label>
            <span id="fileName" class="file-name">ファイル未選択</span>
          </div>
        </div>
        <div class="menu-item" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
          <button id="clearStorageBtn" class="btn btn-clear">保存データをリセット</button>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="stats-container">
        <div class="stat-item">
          <span>全体</span>
          <span id="totalCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span>チェック済</span>
          <span id="checkedCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span>未チェック</span>
          <span id="uncheckedCount" class="stat-value">0</span>
        </div>
      </div>

      <div class="filter-section">
        <button id="filterBtn" class="btn btn-orange">
          チェック済を非表示
        </button>
        <button id="resetBtn" class="btn" style="background-color: #666">
          全て表示
        </button>
        <button id="uncheckAllBtn" class="btn" style="background-color: #555">
          チェックを全解除
        </button>
      </div>
    </div>

    <div id="wordList"></div>

    <script>
      const STORAGE_KEY = "wordbook_data_v2";
      let wordData = [];

      window.onload = function () {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
          wordData = JSON.parse(savedData);
          renderList();
        } else {
          loadDefaultCSV();
        }
      };

      // 同一階層のCSVを自動読み込み
      function loadDefaultCSV() {
        fetch("townname.csv")
          .then(response => {
            if (!response.ok) throw new Error("Network response was not ok");
            return response.arrayBuffer();
          })
          .then(buffer => {
            let text;
            try {
              const decoder = new TextDecoder("shift-jis");
              text = decoder.decode(buffer);
            } catch (e) {
              const decoder = new TextDecoder("utf-8");
              text = decoder.decode(buffer);
            }
            processCSV(text);
          })
          .catch(error => {
            console.log("初期CSVの自動読み込みに失敗しました:", error);
          });
      }

      // ハンバーガーメニューの開閉制御
      const hamburgerBtn = document.getElementById("hamburgerBtn");
      const menuDropdown = document.getElementById("menuDropdown");

      hamburgerBtn.onclick = function (e) {
        e.stopPropagation();
        menuDropdown.classList.toggle("active");
      };

      document.addEventListener("click", function (e) {
        if (!menuDropdown.contains(e.target) && e.target !== hamburgerBtn) {
          menuDropdown.classList.remove("active");
        }
      });

      document
        .getElementById("csvFile")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (!file) return;

          document.getElementById("fileName").textContent = file.name;

          const reader = new FileReader();
          reader.onload = function (event) {
            processCSV(event.target.result);
            menuDropdown.classList.remove("active");
          };
          reader.readAsText(file, "Shift-JIS");
        });

      function processCSV(csvData) {
        wordData = [];
        const rows = csvData.split(/\r?\n/);

        for (let i = 1; i < rows.length; i++) {
          const columns = rows[i].split(",");
          if (columns.length >= 3) {
            const kanji = columns[1].replace(/"/g, "").trim();
            const kana = columns[2].replace(/"/g, "").trim();
            if (kanji && kana) {
              wordData.push({ kanji, kana, checked: false });
            }
          }
        }
        saveAndRender();
      }

      // 数値を更新する関数
      function updateStats() {
        const total = wordData.length;
        const checked = wordData.filter((item) => item.checked).length;
        const unchecked = total - checked;

        document.getElementById("totalCount").textContent = total;
        document.getElementById("checkedCount").textContent = checked;
        document.getElementById("uncheckedCount").textContent = unchecked;
      }

      function createCard(item, index) {
        const container = document.getElementById("wordList");
        const card = document.createElement("div");
        card.className = "word-card";
        if (item.checked) card.classList.add("is-checked");

        card.innerHTML = `
                <input type="checkbox" class="check-box" ${item.checked ? "checked" : ""}>
                <div class="card-content">
                    <span class="kanji">${item.kanji}</span>
                    <span class="kana">${item.kana}</span>
                </div>
            `;

        const checkbox = card.querySelector(".check-box");
        checkbox.onchange = function () {
          wordData[index].checked = checkbox.checked;

          if (checkbox.checked) {
            card.classList.add("is-checked");
          } else {
            card.classList.remove("is-checked");
          }

          saveToStorage();
          updateStats();
        };

        container.appendChild(card);
      }

      function renderList() {
        const container = document.getElementById("wordList");
        container.innerHTML = "";
        wordData.forEach((item, index) => createCard(item, index));
        updateStats();
      }

      function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(wordData));
      }

      function saveAndRender() {
        saveToStorage();
        renderList();
      }

      document.getElementById("filterBtn").onclick = function () {
        const cards = document.querySelectorAll(".word-card");
        cards.forEach((card) => {
          if (card.classList.contains("is-checked")) {
            card.classList.add("hidden");
          }
        });
      };

      document.getElementById("resetBtn").onclick = function () {
        const cards = document.querySelectorAll(".word-card");
        cards.forEach((card) => {
          card.classList.remove("hidden");
        });
      };

      document.getElementById("uncheckAllBtn").onclick = function () {
        if (confirm("全てのチェックを外しますか？")) {
          wordData.forEach((item) => (item.checked = false));
          saveAndRender();
        }
      };

      document.getElementById("clearStorageBtn").onclick = function () {
        if (confirm("全てのデータを削除しますか？")) {
          localStorage.removeItem(STORAGE_KEY);
          wordData = [];
          document.getElementById("fileName").textContent = "ファイル未選択";
          renderList();
          loadDefaultCSV();
          menuDropdown.classList.remove("active");
        }
      };
    </script>
  </body>
</html>
